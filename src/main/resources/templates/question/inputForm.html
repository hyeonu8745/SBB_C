<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<th:block layout:fragment="css">
    <style>
        .fieldError {
            color: red;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container my-3">
    <h2 class="border-bottom pb-3 mb-4">질문 등록</h2>

    <form th:action="@{/question/create}" th:object="${questionDTO}" method="post">

        <!-- 제목 -->
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text"
                   class="form-control"
                   id="subject"
                   name="subject"
                   th:field="*{subject}"
                   placeholder="제목을 입력하세요."
                   >
            <p th:if="${#fields.hasErrors('subject')}"
               class="fieldError"
               th:errors="*{subject}">error</p>
        </div>

        <!-- 내용 -->
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control"
                      id="content"
                      name="content"
                      rows="10"
                      placeholder="질문 내용을 입력하세요."
                      th:field="*{content}"
                      ></textarea>
            <p th:if="${#fields.hasErrors('content')}" class="fieldError" th:errors="*{content}"></p>
        </div>

        <!-- 질문 등록 버튼 -->
        <div class="text-end">
            <button type="submit" class="btn btn-primary">
                질문 등록
            </button>
        </div>

    </form>

</div>
</html>
